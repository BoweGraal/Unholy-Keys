<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Capture the flag &amp; Kart flag designer · Unholy Keys</title>
<script src="art.js?v=1.81.4"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07041a;color:#e8e4f4;font-family:system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:#120e22;border-bottom:1px solid rgba(155,127,224,.35)}
#bar h1{font:800 15px system-ui;margin-right:6px;white-space:nowrap}
button,.btn,select{background:#2a2440;color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:7px 10px;font:700 13px system-ui;cursor:pointer;text-decoration:none;white-space:nowrap;touch-action:manipulation}
button.on{background:#7F77DD;border-color:#b9b2ff}
.btn.go{background:linear-gradient(135deg,#D354A0,#7F77DD);border:0}
.sep{width:1px;height:26px;background:rgba(255,255,255,.15);margin:0 2px}
#name{background:#1b1630;border:1px solid rgba(255,255,255,.16);border-radius:8px;color:#fff;font:600 13px system-ui;padding:7px 9px;width:150px}
#wrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;image-rendering:pixelated;cursor:crosshair}
#status{padding:6px 10px;font:600 12px system-ui;background:#120e22;border-top:1px solid rgba(155,127,224,.35)}
#status b.bad{color:#ff7a85}
#share{display:none;position:absolute;inset:auto 10px 10px 10px;background:#1b1630;border:1px solid rgba(155,127,224,.5);border-radius:12px;padding:10px}
#share.on{display:block}
#share textarea{width:100%;height:110px;background:#0e0a1c;color:#e8e4f4;border:1px solid rgba(255,255,255,.15);border-radius:8px;font:12px ui-monospace,monospace;padding:7px;margin:6px 0}
#share .r{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <h1>🚩🏎️ Flag arena designer</h1>
    <select id="which" title="Capture the flag and Kart flag each keep their own arena"><option value="uk_ctf">🚩 CTF arena</option><option value="uk_kflag">🏎️ Kart flag arena</option></select>
    <button data-k="#" class="on">🧱 Wall</button>
    <button data-k=".">⬛ Floor</button>
    <button data-k="pad" id="padB">⚡ Boost ▶</button>
    <button data-k="R">🟥 Red base</button>
    <button data-k="B">🟦 Blue base</button>
    <button data-k="r">🔴 Red spawn</button>
    <button data-k="b">🔵 Blue spawn</button>
    <button data-k="s">⚡ Sprint refill</button>
    <button data-k="p" title="Kart flag: drive over it for a random item (nitro, oil, shield, mega pulse). Comes back after 8 s.">🎁 Power-up box</button>
    <span class="sep"></span>
    <button id="mirror" class="on" title="Whatever you paint on one side is copied to the other, with the teams swapped">🪞 Mirror</button>
    <button id="undo">↶ Undo</button>
    <select id="size" title="Arena size (changing it starts a fresh arena)"><option value="32x20">Small</option><option value="40x24" selected>Medium</option><option value="48x28">Large</option><option value="56x32">Huge</option><option value="64x30">Kart wide</option><option value="72x34">Kart huge</option></select>
    <input id="name" maxlength="40" placeholder="Arena name">
    <button id="reset">↺ Reset</button>
    <button id="clear">🗑 Clear</button>
    <button id="shareB">📋 Share</button>
    <a class="btn go" id="test" href="venue.html?practice&amp;ctfTest" target="_blank">▶ Test CTF</a>
    <a class="btn go" id="testK" href="venue.html?practice&amp;kflagTest" target="_blank">🏎️ Test kart flag</a>
  </div>
  <div id="wrap"><canvas id="cv"></canvas>
    <div id="share"><b>Share this arena</b> — copy it, or paste someone else's and press Load.<textarea id="shareT"></textarea>
      <div class="r"><button id="copyB">Copy</button><button id="loadB">Load pasted</button><button id="closeB">Close</button></div></div>
  </div>
  <div id="status"></div>
</div>
<script>
(function(){
  var C=ART.CTF,cv=document.getElementById("cv"),g=cv.getContext("2d"),W=0,H=0,dpr=1;
  var map=null,tool="#",padDir=">",mirror=true,hist=[],painting=false,lastCell=null;
  var PADS=[">","v","<","^"],PADICON={">":"▶","v":"▼","<":"◀","^":"▲"};
  var KEY="uk_ctf";try{if(localStorage.getItem("uk_ctf_which")==="uk_kflag")KEY="uk_kflag";}catch(e){}
  function dflt(){return C.clean(KEY==="uk_kflag"?C.kartDefault():C.defaultMap());}
  function load(){map=null;try{map=C.clean(C.upgrade(JSON.parse(localStorage.getItem(KEY)||"null")));}catch(e){}if(!map)map=dflt();}
  load();
  function $(id){return document.getElementById(id);}
  /* the map's tiles as an array while editing; saved back as the string the game uses */
  function grid(){return map.t.split("");}
  function save(){var c=C.clean(map);if(c)try{localStorage.setItem(KEY,JSON.stringify(map));}catch(e){}status();}
  function push(){hist.push(JSON.stringify(map));if(hist.length>80)hist.shift();}
  function status(){var t=map.t,nR=0,nB=0,nr=0,nb=0,np=0,ns=0,nx=0;for(var i=0;i<t.length;i++){var c=t[i];if(c==="R")nR++;if(c==="B")nB++;if(c==="r")nr++;if(c==="b")nb++;if(">v<^".indexOf(c)>=0)np++;if(c==="s")ns++;if(c==="p")nx++;}
    var ok=nR&&nB;$("status").innerHTML=(ok?"":"<b class='bad'>Needs a red base and a blue base before it can be played. </b>")+map.w+" × "+map.h+" tiles · red base "+nR+" · blue base "+nB+" · spawns "+nr+" / "+nb+" · boost pads "+np+" · sprint refills "+ns+" · power-up boxes "+nx+(nx?"":" (Kart flag uses the sprint refills as boxes when there are none)")+
      " · Drag to paint. Right-click (or Floor) to rub out. Click Boost again to turn it. Saved on this device: your arena goes out with every Capture the flag and Kart flag round you start. In Kart flag the sprint refills do nothing and the boxes give items; in Capture the flag the boxes are plain floor.";}
  function mirrorOf(c){return c==="R"?"B":c==="B"?"R":c==="r"?"b":c==="b"?"r":c===">"?"<":c==="<"?">":c;}
  function paint(x,y,c){if(x<=0||y<=0||x>=map.w-1||y>=map.h-1)return;var G=grid();G[y*map.w+x]=c;if(mirror){var mx=map.w-1-x;G[y*map.w+mx]=mirrorOf(c);}map={name:map.name,w:map.w,h:map.h,t:G.join("")};}   /* a fresh object each time, so the arena's worked-out details are redone */
  function view(){return C.fit(C.info(map),W,H,16,16);}
  function cellAt(e){var r=cv.getBoundingClientRect(),V=view(),x=Math.floor((e.clientX-r.left-V.ox)/V.s),y=Math.floor((e.clientY-r.top-V.oy)/V.s);return x>=0&&y>=0&&x<map.w&&y<map.h?[x,y]:null;}
  function toolChar(e){return e&&e.button===2?".":tool==="pad"?padDir:tool;}
  cv.addEventListener("contextmenu",function(e){e.preventDefault();});
  cv.addEventListener("pointerdown",function(e){var c=cellAt(e);if(!c)return;push();painting=toolChar(e);lastCell=c;paint(c[0],c[1],painting);try{cv.setPointerCapture(e.pointerId);}catch(x){}draw();});
  cv.addEventListener("pointermove",function(e){if(!painting)return;var c=cellAt(e);if(!c||(lastCell&&c[0]===lastCell[0]&&c[1]===lastCell[1]))return;
    /* fill in between, so a quick drag leaves no gaps */
    var x0=lastCell[0],y0=lastCell[1],n=Math.max(Math.abs(c[0]-x0),Math.abs(c[1]-y0));for(var k=1;k<=n;k++)paint(Math.round(x0+(c[0]-x0)*k/n),Math.round(y0+(c[1]-y0)*k/n),painting);lastCell=c;draw();});
  ["pointerup","pointercancel"].forEach(function(ev){cv.addEventListener(ev,function(){if(painting){painting=false;save();}});});
  Array.prototype.forEach.call(document.querySelectorAll("[data-k]"),function(b){b.onclick=function(){var k=b.getAttribute("data-k");
    if(k==="pad"&&tool==="pad"){padDir=PADS[(PADS.indexOf(padDir)+1)%4];}tool=k;$("padB").textContent="⚡ Boost "+PADICON[padDir];
    Array.prototype.forEach.call(document.querySelectorAll("[data-k]"),function(o){o.classList.toggle("on",o===b);});};});
  $("mirror").onclick=function(){mirror=!mirror;this.classList.toggle("on",mirror);};
  $("undo").onclick=function(){if(!hist.length)return;map=JSON.parse(hist.pop());$("name").value=map.name;save();draw();};
  document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&document.activeElement!==$("name")){e.preventDefault();$("undo").onclick();}});
  function blank(w,h){var t="";for(var y=0;y<h;y++)for(var x=0;x<w;x++){var edge=x===0||y===0||x===w-1||y===h-1,mid=Math.floor(h/2);
      t+=edge?"#":(x>=2&&x<=4&&y>=mid-2&&y<=mid+1)?"R":(x>=w-5&&x<=w-3&&y>=mid-2&&y<=mid+1)?"B":(x===2&&(y===2||y===h-3))?"r":(x===w-3&&(y===2||y===h-3))?"b":".";}
    return{name:map&&map.name||"My arena",w:w,h:h,t:t};}
  $("size").onchange=function(){var p=this.value.split("x");if(!confirm("Start a fresh arena at this size? (Undo brings the old one back.)")){this.value=map.w+"x"+map.h;return;}push();map=blank(+p[0],+p[1]);save();draw();};
  $("reset").onclick=function(){push();map=dflt();$("name").value=map.name;$("size").value=map.w+"x"+map.h;save();draw();};
  $("clear").onclick=function(){push();map=blank(map.w,map.h);save();draw();};
  $("name").value=map.name;$("name").oninput=function(){map.name=this.value.slice(0,40)||"My arena";save();};
  $("size").value=map.w+"x"+map.h;if($("size").selectedIndex<0){var o=document.createElement("option");o.value=o.textContent=map.w+"x"+map.h;$("size").appendChild(o);$("size").value=o.value;}
  $("shareB").onclick=function(){$("shareT").value=JSON.stringify(map);$("share").classList.add("on");};
  $("closeB").onclick=function(){$("share").classList.remove("on");};
  $("copyB").onclick=function(){$("shareT").select();try{navigator.clipboard.writeText($("shareT").value);}catch(e){document.execCommand("copy");}};
  $("loadB").onclick=function(){var m=null;try{m=C.clean(JSON.parse($("shareT").value));}catch(e){}if(!m){alert("That doesn't look like a Capture the flag arena.");return;}push();map=m;$("name").value=m.name;$("size").value=m.w+"x"+m.h;save();draw();$("share").classList.remove("on");};
  function size(){dpr=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0);g.imageSmoothingEnabled=false;draw();}
  function draw(){g.fillStyle="#07041a";g.fillRect(0,0,W,H);var I=C.info(map),V=view();
    var st=C.newState(I,[],true);C.draw(g,map,I,V,performance.now(),st);
    /* a faint line down the middle while mirroring */
    if(mirror){g.fillStyle="rgba(255,255,255,.12)";for(var y=V.oy;y<V.oy+V.s*map.h;y+=8)g.fillRect(Math.round(V.ox+V.s*map.w/2)-1,y,2,4);}}
  window.addEventListener("resize",size);setInterval(draw,120);size();status();
  $("which").value=KEY;$("which").onchange=function(){KEY=this.value;try{localStorage.setItem("uk_ctf_which",KEY);}catch(e){}hist=[];load();$("name").value=map.name;$("size").value=map.w+"x"+map.h;save();draw();};
  window.ukCtfMap=function(){return map;};
})();
</script>
</body>
</html>
